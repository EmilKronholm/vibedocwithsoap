<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Folio example: web component</title>
    <style>
      body { margin: 0; font: 13px system-ui, sans-serif; background: #e8eaed; }
      header { display: flex; gap: 8px; align-items: center; padding: 10px 16px; background: #fff; border-bottom: 1px solid #d5d8dd; position: sticky; top: 0; z-index: 1; }
      header span { color: #64748b; margin-left: auto; }
      main { padding: 24px; }
      folio-editor { display: block; width: max-content; margin: 0 auto; }
      folio-editor [contenteditable] { outline: none; }
      folio-editor [contenteditable]:focus { box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.4); }
    </style>
  </head>
  <body>
    <header>
      <button id="undo">Undo</button>
      <button id="redo">Redo</button>
      <button id="print">Print / PDF</button>
      <span id="status"></span>
    </header>
    <main id="slot"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
