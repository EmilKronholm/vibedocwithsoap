<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VibeDocWithSoap showcase</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font: 13px/1.4 system-ui, sans-serif; color: #0f172a; background: #e8eaed; }
      .app { display: grid; grid-template-columns: minmax(0, 1fr) 460px; height: 100vh; }
      .stage { overflow: auto; padding: 28px 24px; }
      #page { width: max-content; max-width: 100%; margin: 0 auto; }
      #page [contenteditable] { outline: none; border-radius: 2px; }
      #page [contenteditable]:hover { box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12); }
      #page [contenteditable]:focus { box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.4); }

      aside { display: flex; flex-direction: column; min-height: 0; background: #fff; border-left: 1px solid #d5d8dd; }
      .top { padding: 12px 16px 8px; border-bottom: 1px solid #e2e8f0; }
      .top h1 { font-size: 15px; margin: 0 0 2px; }
      .top p { margin: 0; color: #64748b; }
      .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
      .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #f1f5f9; color: #475569; }
      .chip.working, .chip.reviewing { background: #fef3c7; color: #92400e; }
      nav { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 12px; border-bottom: 1px solid #e2e8f0; }
      nav button { border: 0; background: transparent; padding: 4px 9px; border-radius: 6px; cursor: pointer; color: #475569; }
      nav button:hover { background: #f1f5f9; }
      nav button.on { background: #1f3d63; color: #fff; }
      #banner { margin: 10px 16px 0; padding: 7px 10px; border-radius: 6px; font-size: 12px; }
      #banner:empty { display: none; }
      #banner.ok { background: #dcfce7; color: #166534; }
      #banner.no { background: #fee2e2; color: #991b1b; }
      #content { flex: 1; overflow: auto; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
      #content h2 { font-size: 14px; margin: 0; }
      .intro { margin: 0; color: #475569; }
      .group { border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
      .group > h3 { font-size: 11px; margin: 0; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; }
      .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-end; }
      .field { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 80px; }
      .field > span, small, .hint { color: #64748b; font-size: 11px; }
      .hint { margin: 0; }
      .warn { color: #b45309; margin: 0; }
      .card { border: 1px solid #e2e8f0; border-radius: 6px; padding: 6px 8px; display: flex; flex-direction: column; gap: 3px; }
      input, select, textarea, button { font: inherit; }
      input:not([type]), input[type="number"], select, textarea { width: 100%; padding: 4px 6px; border: 1px solid #cbd5e1; border-radius: 4px; background: #fff; }
      input[type="color"] { width: 100%; height: 26px; padding: 0; border: 1px solid #cbd5e1; border-radius: 4px; }
      textarea { resize: vertical; }
      button.act { padding: 4px 10px; border: 1px solid #cbd5e1; border-radius: 4px; background: #fff; cursor: pointer; }
      button.act:hover:not(:disabled) { background: #f1f5f9; }
      button.act:disabled { opacity: 0.45; cursor: default; }
      button.try { border-color: #1f3d63; color: #1f3d63; }
      pre { margin: 0; padding: 6px 8px; background: #f8fafc; border-radius: 4px; font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; max-height: 200px; overflow: auto; }
      #log { margin: 0 16px 12px; max-height: 150px; flex: none; }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="stage"><div id="page"></div></div>
      <aside>
        <div class="top">
          <h1>VibeDocWithSoap showcase</h1>
          <p>Every feature of the library, one tab each.</p>
          <div class="chips" id="chips"></div>
        </div>
        <nav id="nav"></nav>
        <div id="banner"></div>
        <div id="content"></div>
        <pre id="log"></pre>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
